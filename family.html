<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff5fa2" />
    <!-- 홈 화면에 추가해서 쓰면 orientation: portrait 가 세로를 진짜로 잠근다.
         브라우저 탭에서는 못 잠그므로 .rotate-notice 가 대신 막는다. -->
    <link rel="manifest" href="app.webmanifest" />
    <meta name="description" content="가족이 함께 재료를 모아 생일 케이크를 완성하는 파티 게임" />
    <title>엄마의 생일 대작전!</title>
    <!-- 단톡방에 링크를 붙였을 때 뜨는 미리보기. 카카오톡은 그림 주소를 전체 주소로 줘야 읽는다.
         공개 사이트(lodisign.github.io/mom-birthday) 기준이라 PC 미리보기에서는 안 뜬다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🎂 엄마의 생일 대작전!" />
    <meta property="og:description" content="특별한 생일을 즐겨보세요! 가족들과 함께 재료를 모아 케이크를 완성해요." />
    <meta property="og:url" content="https://lodisign.github.io/mom-birthday/family.html" />
    <meta property="og:image" content="https://lodisign.github.io/mom-birthday/public/ui/title-happy-birthday.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="408" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css?v=pop-v1" />
    <link rel="stylesheet" href="css/base.css?v=pop-v1" />
    <link rel="stylesheet" href="css/components.css?v=pop-v1" />
    <link rel="stylesheet" href="css/screens.css?v=pop-v1" />
    <link rel="stylesheet" href="css/cake.css?v=pop-v1" />
    <link rel="stylesheet" href="css/motion.css?v=pop-v1" />
  </head>
  <body>
    <div class="sky-decor cloud one" aria-hidden="true"></div>
    <div class="sky-decor cloud two" aria-hidden="true"></div>
    <main id="app" class="app-shell"></main>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div class="rotate-notice" role="alert">
      <i aria-hidden="true">📱</i>
      <b>세로로 돌려주세요</b>
      <span>이 게임은 세로 화면에서만 놀 수 있어요</span>
    </div>
    <!-- 가족용 페이지는 항상 가족 모드. 편집 버튼도 "새 파티 만들기"도 없고,
         게임에서 "🙋 도와주세요"가 나온다. 링크를 받은 사람이 파티를 만들 수 없게
         여기는 false로 굳혀 둔다 — 파티를 만드는 건 앱(index.html) 쪽이다.
         core.js가 읽는 순간의 값이 그대로 굳는다(const isEditor). 반드시 core.js 앞. -->
    <script>window.GAME_OPTIONS = { editor: false };</script>
    <!-- 저장소. supabase 라이브러리 → 연결 값 → 우리 코드. store.js 는 core.js 의 값을 빌려 쓰므로 core.js 뒤. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js?v=pop-v1"></script>
    <script src="js/core.js?v=pop-v1"></script>
    <script src="js/store.js?v=pop-v1"></script>
    <script src="js/sfx.js?v=pop-v1"></script>
    <script src="js/chiptune.js?v=pop-v1"></script>
    <script src="js/happy-birthday-beats.js?v=pop-v1"></script>
    <script src="js/minigames.js?v=pop-v1"></script>
    <script src="js/cake-game.js?v=pop-v1"></script>
    <script src="js/screens.js?v=pop-v1"></script>
    <script src="js/face.js?v=pop-v1"></script>
    <!-- 편집 모드에서만 쓰이지만, 없으면 편집 버튼을 눌렀을 때 터진다. 같이 싣는다. -->
    <script src="js/editor.js?v=pop-v1"></script>
    <script src="js/boot.js?v=pop-v1"></script>
    <!-- 앱으로 설치되게 하는 서비스워커. 파일을 캐시하지는 않는다(sw.js 설명 참고).
         실패해도 게임은 그대로 돌아가므로 조용히 넘어간다. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
